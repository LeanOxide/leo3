name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  # Dispatched manually or by the lean-release-watch sentinel when a new
  # leanprover/lean4 stable/beta release is published.
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  smoke-rustfmt:
    name: Smoke / Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Check formatting
        run: cargo fmt --all --check

  smoke-clippy:
    name: Smoke / Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Clippy check
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  compat-clippy-beta:
    name: Compat / Clippy (beta)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Clippy check (beta)
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  api-semver:
    name: API / Semver Checks
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'semver-break')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Install elan
        run: |
          echo "::group::Elan Installation Output"
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          rm -f elan-init
          echo "::endgroup::"
      - name: Setup Lean PATH
        run: |
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get merge base
        id: merge-base
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})
          echo "sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: leo3, leo3-ffi
          baseline-rev: ${{ steps.merge-base.outputs.sha }}

  smoke-msrv:
    name: Smoke / MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: cargo check
        run: LEO3_NO_LEAN=1 cargo check --locked --workspace --all-features

  smoke-no-lean:
    name: Smoke / No Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Run non-runtime library tests without Lean
        run: LEO3_NO_LEAN=1 cargo test --locked --workspace --exclude leo3 --lib
      - name: Compile all tests without Lean
        run: LEO3_NO_LEAN=1 cargo check --locked --workspace --tests --all-features
      - name: Compile core leo3 doctests without Lean
        run: RUSTC_WRAPPER= LEO3_NO_LEAN=1 cargo test --locked -p leo3 --doc --no-default-features
      - name: Compile feature-gated leo3 doctests without Lean
        run: RUSTC_WRAPPER= LEO3_NO_LEAN=1 cargo test --locked -p leo3 --doc --features "macros,task,tokio"
      - name: Compile leo3-macros doctests without Lean
        run: RUSTC_WRAPPER= LEO3_NO_LEAN=1 cargo test --locked -p leo3-macros --doc

  smoke-minimal-surface:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      lean: stable
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Smoke / Minimal Surface
      command: LEO3_NO_LEAN=1 cargo test --locked -p leo3 --no-default-features --test test_features

  smoke-optional-surface:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      lean: stable
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Smoke / Optional Feature Surface
      command: 'LEO3_NO_LEAN=1 cargo test --locked -p leo3 --no-default-features --features "macros,meta,io,module-loading,tokio" --test test_features'

  macro-ui:
    name: Macro / UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Run trybuild UI tests
        run: LEO3_NO_LEAN=1 cargo test --locked -p leo3 --features macros --test test_compile_error

  runtime-core:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      lean: stable
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Runtime / Core
      command: cargo test --locked -p leo3 --features runtime-tests --test basic --test nat_ops --test string_ops --test array_ops --test test_conversion --test test_gc

  runtime-async:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      lean: stable
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Runtime / Async
      command: 'cargo test --locked -p leo3 --features "tokio,runtime-tests" --test test_task_async --test test_tokio_bridge'

  macro-runtime:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      lean: stable
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Macro / Runtime
      command: 'cargo test --locked -p leo3 --features "macros,runtime-tests" --test test_conversion_macros --test test_derive_macros --test test_leanclass --test test_leanclass_codegen --test test_leanclass_minimal --test test_leanfn_macro --test test_lean_instance --test test_leanmodule --test test_macro_pipeline --example macro_pipeline'

  ffi-check:
    name: Runtime / FFI Check (Linux, Lean stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install elan
        run: |
          echo "::group::Elan Installation Output"
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          rm -f elan-init
          echo "::endgroup::"

      - name: Setup Lean PATH
        run: echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run FFI validation checks
        run: |
          LEAN_PREFIX="$("$HOME"/.elan/bin/lean --print-prefix)"
          LD_LIBRARY_PATH="$LEAN_PREFIX/lib/lean" cargo test --manifest-path leo3-ffi-check/Cargo.toml

  compat-feature-powerset:
    name: Compat / Feature Powerset
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - uses: taiki-e/install-action@cargo-hack
      - name: Check all feature combinations
        run: LEO3_NO_LEAN=1 cargo hack check --feature-powerset --exclude-features runtime-tests --workspace --tests

  compat-runtime-matrix:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build-full')
    strategy:
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lean: ['stable', 'beta', 'nightly', 'v4.20.0']
        exclude:
          - os: macos-latest
            lean: 'v4.20.0'
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      lean: ${{ matrix.lean }}
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Compat / Full Matrix
      command: cargo test --locked --all-features --workspace

  heavy-careful:
    name: Heavy / Careful (UB detection)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build-full')
    runs-on: ubuntu-latest
    # The default 6h cap turns a hung runner into a full CI stall; 2h is
    # ample for the instrumented full-suite run (observed 1-1.5h when it
    # works) and fails fast when the runner wedges without output.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      # Pin the toolchain: the 2026-08-10 nightly ships a broken `libstd`
      # (cargo-careful cannot even load the test harness) and the 2026-08-11
      # nightly hangs the job without any output. 2026-08-03 is the last
      # nightly verified to run cargo-careful cleanly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-03
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - uses: taiki-e/install-action@cargo-careful

      - name: Install elan
        run: |
          echo "::group::Elan Installation Output"
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          rm -f elan-init
          echo "::endgroup::"

      - name: Setup Lean PATH
        run: echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run tests under cargo-careful
        run: cargo careful test --locked --all-features --workspace

  heavy-asan:
    name: Heavy / AddressSanitizer
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build-full')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}

      - name: Install elan
        run: |
          echo "::group::Elan Installation Output"
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          rm -f elan-init
          echo "::endgroup::"

      - name: Setup Lean PATH
        run: echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run tests under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0:intercept_tls_get_addr=0:alloc_dealloc_mismatch=0
        run: cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --all-features --workspace

  smoke-docs:
    name: Smoke / Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          LEO3_NO_LEAN: 1
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  coverage:
    name: Heavy / Coverage
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: Install elan
        run: |
          echo "::group::Elan Installation Output"
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          rm -f elan-init
          echo "::endgroup::"

      - name: Setup Lean PATH
        run: |
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          "$HOME"/.elan/bin/lean --version
          "$HOME"/.elan/bin/lake --version

      - name: Collect coverage data (including doctests)
        run: |
          cargo llvm-cov --no-report nextest
          cargo llvm-cov --no-report --doc
          cargo llvm-cov report --doctests --lcov --output-path lcov.info

      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}

  bench:
    name: Bench / Criterion Suite
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      lean: stable
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Bench / Criterion Suite
      command: cargo bench --locked -p leo3 --features "macros,runtime-tests" --bench array_conversion --bench int_ops_small --bench int_ops_big --bench container_ops --bench string_conversion --bench macro_wrapper_overhead -- --quick

  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      lean: v4.30.0
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      suite: Examples / End-to-End
      command: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "macOS" ]; then LIBPATH_VAR=DYLD_LIBRARY_PATH; else LIBPATH_VAR=LD_LIBRARY_PATH; fi

        echo "::group::lake-integration"
        cd examples/lake-integration/native
        LEO3_NO_LEAN=1 cargo build --release
        cd ../lean
        lake build app
        env "$LIBPATH_VAR=$PWD/../native/target/release" .lake/build/bin/app
        cd ../../..
        echo "::endgroup::"

        echo "::group::class-integration"
        cd examples/class-integration
        ./gen-lean.sh
        # The generated declarations are committed; fail if codegen output
        # drifted from what is checked in.
        git diff --exit-code -- lean
        cd lean
        lake build app
        env "$LIBPATH_VAR=$PWD/../native/target/release" .lake/build/bin/app
        cd ../../..
        echo "::endgroup::"

  compat-failure-report:
    name: CI / Compat Failure Reporter
    # Track version drift only for real mainline runs: pushes to main, the
    # daily scheduled sweep, and workflow_dispatch (incl. the release
    # sentinel). Never for pull_request events or feature branches.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    needs:
      - compat-runtime-matrix
      - heavy-careful
      - heavy-asan
      - coverage
      - bench
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v6
      - name: Report beta/nightly and Heavy failures as tracked issues
        uses: actions/github-script@v9
        with:
          script: |
            const script = require('./.github/scripts/compat-watch.js')
            try {
              await script({github, context, core})
            } catch (error) {
              // The reporter must never turn a green run red.
              core.warning(`compat-watch reporter failed: ${error}`)
            }

  conclusion:
    name: CI Conclusion
    if: always()
    needs:
      - smoke-rustfmt
      - smoke-clippy
      - api-semver
      - smoke-msrv
      - smoke-no-lean
      - smoke-minimal-surface
      - smoke-optional-surface
      - macro-ui
      - runtime-core
      - runtime-async
      - macro-runtime
      - ffi-check
      - bench
      - examples
      - compat-feature-powerset
      - compat-runtime-matrix
      - heavy-careful
      - heavy-asan
      - smoke-docs
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
